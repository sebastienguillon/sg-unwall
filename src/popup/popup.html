<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="../icons/icon-32.png" width="20" height="20" alt="" />
      <strong>SG Unwall</strong>
      <span id="host"></span>
    </header>

    <label class="row"><input type="checkbox" id="site" /> Active on this site</label>
    <label class="row"
      ><input type="checkbox" id="banners" /> Also hide non-blocking cookie banners</label
    >
    <label class="row"><input type="checkbox" id="debug" /> Debug log in the page console</label>

    <div class="buttons">
      <button id="zap" title="Hide whatever still covers the page and unlock scrolling">
        Zap now
      </button>
      <button id="undo" title="Restore everything SG Unwall changed on this page">
        Undo on this page
      </button>
    </div>

    <p id="state"></p>
    <ul id="list"></ul>
    <script src="popup.js"></script>
  </body>
</html>
